[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agents-in-action"
version = "0.1.0"
description = "Code for the book Data Agents in Action (Manning)."
requires-python = ">=3.11"
authors = [{ name = "Abdulrafiu Izuafa" }]
license = "MIT"

# Only kora/ is a package. Without this, setuptools sees the chapter
# folders as extra packages and refuses to build.
[tool.setuptools]
packages = ["kora"]

[tool.pytest.ini_options]
testpaths = ["tests", "ch02/end/tests"]
# importlib mode names each test module by its full path, so every
# chapter can have its own test_agent.py without clashing. It no
# longer adds folders to sys.path, so the repo root goes on it here
# for the kora package.
pythonpath = ["."]
# Live tests call a real model and cost money, so a plain pytest run
# skips them. Run them with: pytest -m live
addopts = "--import-mode=importlib -m \"not live\""
markers = [
    "slow: long-running checks; skip with -m \"not slow\"",
    "live: calls a real model provider; needs an API key in .env",
]

[tool.ruff]
line-length = 76
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
